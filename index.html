<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>نادي الإبداع وريادة الأعمال</title>
  <link rel="icon" type="image/png" href="./logo2.png">

  <style>
    html {
      background: #02141a;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: 'Readex Pro', sans-serif;
      background: url("./خلفية٦.png") no-repeat center center fixed;
      background-size: cover;
      background-color: #02141a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: none;
    }

    body,
    input,
    button,
    a,
    p,
    h1,
    div {
      font-family: 'Readex Pro', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 390px;
      min-height: 610px;
      background: rgba(0, 8, 12, 0.42);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 34px;
      padding: 52px 34px 32px;
      text-align: center;
      box-sizing: border-box;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.45);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-container img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin-top: 18px;
      margin-bottom: 10px;
    }

    p {
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin-top: 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.10);
      color: white;
      font-size: 15px;
      text-align: center;
      outline: none;
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    input::placeholder {
      color: rgba(255,255,255,0.55);
    }

    button,
    .btn-link {
      width: 100%;
      padding: 18px;
      margin-top: 16px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      background: rgba(50, 116, 129, 0.78);
      color: white;
      cursor: pointer;
      transition: 0.25s ease;
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    button:hover,
    .btn-link:hover {
      background: rgba(96, 208, 230, 0.88);
      transform: scale(1.02);
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 18px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.05);
      color: white;
      line-height: 1.8;
      box-sizing: border-box;
    }

    .social-section {
      margin-top: 50px;
    }

    .social-link {
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-decoration: underline;
      display: inline-block;
      margin-top: 6px;
    }

    .social-link:hover {
      color: #d1e7e8;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
        align-items: center;
        min-height: 100dvh;
        background: url("./الجوال.png") no-repeat center center fixed;
        background-size: cover;
      }

      .card {
        width: 100%;
        max-width: 390px;
        min-height: auto;
        border-radius: 28px;
        padding: 34px 20px 26px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .logo-container {
        margin-bottom: 12px;
      }

      .logo-container img {
        width: 125px;
        height: 125px;
      }

      h1 {
        margin: 12px 0 10px;
        font-size: 34px;
        line-height: 1.25;
        letter-spacing: -0.5px;
      }

      p {
        font-size: 13px;
        line-height: 1.8;
        margin-bottom: 20px;
      }

      input {
        padding: 15px;
        font-size: 14px;
        margin-top: 10px;
      }

      button,
      .btn-link {
        padding: 15px;
        font-size: 15px;
        margin-top: 14px;
      }

      .message {
        font-size: 13px;
        padding: 14px;
        line-height: 1.7;
      }

      .social-section {
        margin-top: 32px;
      }

      .social-link {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-container">
      <img src="./logo.png" alt="شعار النادي" />
    </div>

    <h1>عضوية المُبدعين</h1>

    <p>أدخل السجل المدني أو الرقم الجامعي للتحقق من حالة عضويتك</p>

    <input type="text" id="identifier" placeholder="الرقم الجامعي أو السجل المدني" />

    <button onclick="checkMembership()">التحقق من العضوية</button>

    <div id="updateSection" class="hidden">
      <div id="currentStatusMsg" class="message"></div>
      <button id="btnSwitch" onclick="switchMemberType()">تعديل نوع العضوية</button>
    </div>

    <div id="externalRegisterSection" class="hidden">
      <a href="https://forms.gle/XXXXXX" target="_blank" class="btn-link">
        اضغط هنا للتسجيل في النادي
      </a>
    </div>

    <div id="result" class="message hidden"></div>

    <div class="social-section">
      <a href="https://linktr.ee/iecuqu" target="_blank" class="social-link">
        حسابات النادي
      </a>
    </div>
  </div>

  <script>
    let currentType = "";
    let lastCheckedIdentifier = "";

    const SHEET_ID = "1yqR1G5Olrbr9PsV2j9Z0yt2xtkftZJfIoXupSMcNBUM";
    const SHEET_NAME = "Members";

    async function getMembers() {
      const url = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("تعذر الاتصال بملف Google Sheets");
      }

      return await response.json();
    }

    function showMessage(text) {
      const resDiv = document.getElementById("result");
      resDiv.innerText = text;
      resDiv.classList.remove("hidden");
    }

    async function checkMembership() {
      const identifier = document.getElementById("identifier").value.trim().toLowerCase();

      if (!identifier) {
        showMessage("فضلاً أدخل الرقم الجامعي أو السجل المدني أولاً.");
        return;
      }

      lastCheckedIdentifier = identifier;

      document.getElementById("result").classList.add("hidden");
      document.getElementById("updateSection").classList.add("hidden");
      document.getElementById("externalRegisterSection").classList.add("hidden");

      try {
        const members = await getMembers();

        const member = members.find(m =>
          String(m["الإيميل الجامعي"] || m.email || "").trim().toLowerCase() === identifier ||
          String(m["الرقم الجامعي"] || m.studentID || "").trim().toLowerCase() === identifier ||
          String(m["السجل المدني"] || "").trim().toLowerCase() === identifier
        );

        if (member) {
          currentType = member["العضوية"] || member["نوع العضوية"] || member.memberType || "عضو";

          document.getElementById("currentStatusMsg").innerText =
            "نوع عضويتك الحالية: (" + currentType + ")";

          document.getElementById("updateSection").classList.remove("hidden");

        } else {
          showMessage("أنت غير مسجل في النادي، فضلاً اضغط على الزر بالأسفل للانتقال لنموذج التسجيل.");
          document.getElementById("externalRegisterSection").classList.remove("hidden");
        }

      } catch (error) {
        showMessage("حدث خطأ أثناء قراءة بيانات العضوية. تأكدي أن الشيت عام وأن اسم التبويب Members.");
      }
    }

    function switchMemberType() {
      showMessage("لا يمكن تحديث نوع العضوية من GitHub Pages مباشرة. التحديث يحتاج Google Apps Script أو Backend.");
    }
  </script>
</body>
</html>
